    org: Children's Hospital of Philadelphia
    unit: Division of Genomic Diagnostics, Translational Bioinformatics
    location: Philadelphia, PA
    dates: Jun 2023 – present
    bullets:
      - Develop and clinically translate methods for structural and copy-number variant detection in clinical genome sequencing, working with clinical geneticists and genetic counselors to improve diagnostic yield in rare pediatric disease.
      - Built the bioinformatics function for CHOP's Undiagnosed Disease Program and co-designed its automated case workflow (data intake, DRAGEN processing, Emedgene prioritization) with the Arcus informatics team.
      - Contribute to multi-omic and long-read diagnostic studies, including a genome–transcriptome re-analysis of Cornelia de Lange syndrome (npj Genomic Medicine 2026) and the WAFL long-read workflow (ACMG 2026 oral).

  - title: Associate Data Scientist
    org: MD Anderson Cancer Center
    location: Houston, TX
    dates: Jan 2022 – Jun 2023
    bullets:
      - Led the computational analysis of exceptional responders to immune checkpoint inhibitors in renal cell carcinoma, integrating exome and RNA-seq data (Nature Cancer 2025, co-first author).
      - Designed and validated pipelines to quantify human endogenous retrovirus expression from short- and long-read RNA-seq and applied them to lymphoma cohorts.
      - Benchmarked long-read sequencing methods for isoform characterization, structural variant detection and antigen discovery.

  - title: Bioinformatics Analyst
    org: Dana-Farber Cancer Institute
    location: Boston, MA
    dates: Sep 2020 – Jan 2022
    bullets:
      - Led the cross-trial validation of renal cell carcinoma molecular subtypes between two phase III trials using a random-forest classifier (Cancer Cell 2024, co-first author).
      - Analyzed exome and RNA-seq data from more than 2,000 patients across clinical-trial cohorts and public datasets (TCGA, PCAWG).
      - Containerized published pipelines and deployed them with WDL and Snakemake on GCP/FireCloud and AWS.

  - title: Computational Biology Co-op
    org: Novartis Institutes for BioMedical Research
    unit: Respiratory Disease Area
    location: Cambridge, MA
    dates: Jun 2019 – Sep 2020
    bullets:
      - Ran differential expression and pathway enrichment analyses on time-course gene expression data from mouse models of cigarette smoke exposure, characterizing acute versus chronic response.
      - Compared these signatures with COPD patient data to assess translational relevance and inform indication expansion for existing drugs.
      - Built an interactive Spotfire dashboard for translational and drug discovery scientists to explore results.

